```html
{% extends 'studentparent.html' %}

{% block body %}

<div class="row">
    <div class="col-md-12 grid-margin stretch-card">

        <div class="card">
            <div class="card-body">

                <h3 class="card-title">
                    Post Your Answer
                </h3>

                <p class="text-muted">
                    Write your answer for the question below.
                </p>

                <hr>

                <!-- QUESTION -->
                <div class="alert alert-light">

                    <h5>
                        Question:
                    </h5>

                    <p class="mb-0">
                        {{ question.question }}
                    </p>

                    <small class="text-muted">
                        Posted by {{ question.postedby }}
                        on {{ question.posteddate }}
                    </small>

                </div>

                <!-- ANSWER FORM -->
                <form method="POST"
                      action="{% url 'studentapp:postanswer' question.qid %}">

                    {% csrf_token %}

                    <div class="form-group">

                        <label>
                            Your Answer
                        </label>

                        <textarea
                            name="answer"
                            class="form-control"
                            rows="6"
                            placeholder="Write your answer here..."
                            required></textarea>

                    </div>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="mdi mdi-send"></i>
                        Post Answer

                    </button>

                    <a href="{% url 'studentapp:postquestion' %}"
                       class="btn btn-secondary">

                        Back to Discussion

                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock body %}
```
